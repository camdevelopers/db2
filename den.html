  async function load() {
  try {
    const keyHex = (localStorage.enc_key || "").trim();
    if (!/^[0-9a-fA-F]{64}$/.test(keyHex)) {
      document.body.innerHTML = '<pre style="color:red">Error: localStorage.enc_key missing or not 64 hex chars.</pre>';
      return;
    }

    // Decode base64 → bytes
    const raw = atob(JS_BUNDLE);
    const buf = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);

    // Split: first 12 bytes = IV, rest = ciphertext
    const iv = buf.slice(0, 12);
    const ct = buf.slice(12);

    // Hex key → bytes
    const keyBytes = new Uint8Array(32);
    for (let i = 0; i < 32; i++)
      keyBytes[i] = parseInt(keyHex.substr(i * 2, 2), 16);

    // Decrypt
    const key = await crypto.subtle.importKey("raw", keyBytes, { name: "AES-GCM" }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
    const html = new TextDecoder().decode(pt);

    // Replace entire page with decrypted content
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<pre style="color:red">Decrypt error: ' + e.message + '</pre>';
  }
}
