  <style>



  #refresh-cache {
  position: fixed;
  bottom: 16px;
  right: 16px;
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 50%;
  background: transparent;
  box-shadow: none;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  z-index: 9999;
  transition: transform 0.2s, opacity 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.5;
  color: inherit;
}

#refresh-cache:hover {
  transform: scale(1.15);
  opacity: 1;
}

#refresh-cache:active {
  transform: scale(0.95);
}   







    #gate {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #6b21a8 100%);
  background-size: 300% 300%;
  animation: gateGradient 12s ease infinite;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

#gate[hidden] { display: none; }

@keyframes gateGradient {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

#gate .panel {
  width: 100%;
  max-width: 400px;
  margin: 1.5rem;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 1.25rem;
  padding: 2rem 1.75rem;
  text-align: center;
}

#gate .panel h1 { color: #fff; font-size: 1.5rem; font-weight: 700; margin: 0 0 0.25rem; }
#gate .panel .sub { color: rgba(255,255,255,0.65); font-size: 0.85rem; margin: 0 0 1.25rem; }
#gate .panel label { display: block; text-align: left; color: rgba(255,255,255,0.8); font-size: 0.8rem; margin: 0 0 4px; }
#gate .panel .key-row { display: flex; gap: 6px; align-items: center; margin-bottom: 1rem; }
#gate .panel input {
  flex: 1; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.25);
  border-radius: 8px; background: rgba(0,0,0,0.25); color: #fff;
  font-family: monospace; font-size: 0.85rem; width: 100%;
}
#gate .panel input:focus { outline: 2px solid rgba(255,255,255,0.5); outline-offset: 1px; }
#gate .panel button {
  padding: 8px 16px; border: none; border-radius: 8px;
  font-size: 0.85rem; font-weight: 600; cursor: pointer;
}
#gate .panel .btn-unlock { background: rgba(255,255,255,0.25); color: #fff; border: 1px solid rgba(255,255,255,0.3); }
#gate .panel .btn-unlock:hover { background: rgba(255,255,255,0.38); }
#gate .panel .btn-show { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 8px 12px; }
#gate .panel .btn-show:hover { background: rgba(255,255,255,0.28); }
#gate .panel .actions { display: flex; gap: 8px; justify-content: center; margin-top: 0; }
#gate .panel .msg { margin-top: 10px; font-size: 0.82rem; min-height: 1.2em; }
#gate .panel .msg.ok { color: #a5f3a5; }
#gate .panel .msg.err { color: #ffb3b3; }   
  </style>
</head>

    <div class="key-row">
      <input id="gateKey" type="password" spellcheck="false" autocomplete="off" autofocus>
      <button id="gateShow" type="button" class="btn-show">Show</button>
    </div>
    <div class="actions">
      <button id="gateUnlock" type="button" class="btn-unlock">Unlock</button>
    </div>
    <div id="gateMsg" class="msg"></div>
  </div>
</div>

  var HEX64 = /^[0-9a-fA-F]{64}$/;



  var LOADER_LS_KEY = "_loader_js";


  function hexToBytes(hex) {
    var out = new Uint8Array(hex.length / 2);
    for (var i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
    return out;
  }

  function b64ToBytes(b64) {
    var s = atob(b64.replace(/\s+/g, ""));
    var out = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
    return out;
  }

  async function decryptBlob(b64, keyHex) {
    var all = b64ToBytes(b64);
    var iv = all.slice(0, 12);
    var ct = all.slice(12);
    var key = await crypto.subtle.importKey("raw", hexToBytes(keyHex), { name: "AES-GCM" }, false, ["decrypt"]);
    var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
    return new TextDecoder().decode(pt);
  }

  function applyToLocalStorage(flat) {
    var simple = {}, grouped = {};
    Object.keys(flat).forEach(function (k) {
      var dotIdx = k.indexOf(".");
      if (dotIdx === -1) { simple[k] = flat[k]; }
      else {
        var prefix = k.substring(0, dotIdx);
        var subKey = k.substring(dotIdx + 1);
        if (!grouped[prefix]) grouped[prefix] = {};
        grouped[prefix][subKey] = flat[k];
      }
    });
    Object.keys(simple).forEach(function (k) { localStorage.setItem(k, simple[k]); });
    Object.keys(grouped).forEach(function (prefix) {
      var existing = {};
      var prev = localStorage.getItem(prefix);
      if (prev) { try { existing = JSON.parse(prev); } catch (e) { existing = {}; } }
      Object.keys(grouped[prefix]).forEach(function (sk) { existing[sk] = grouped[prefix][sk]; });
      localStorage.setItem(prefix, JSON.stringify(existing));
    });
  }

  function injectScript(code) {
    var el = document.createElement("script");
    el.textContent = code;
    document.body.appendChild(el);
  }

  async function loadLoader(jsKey) {
  // Reuse cached plaintext if available
  var cached = localStorage.getItem(LOADER_LS_KEY);
  if (cached) {
    injectScript(cached);
    return;
  }
  // Otherwise decrypt and cache
  var jsCode = await decryptBlob(JS_BUNDLE, jsKey);
  localStorage.setItem(LOADER_LS_KEY, jsCode);
  injectScript(jsCode);

  }

  var gateKey = document.getElementById("gateKey");
  var gateMsg = document.getElementById("gateMsg");
  var gateShow = document.getElementById("gateShow");

  gateShow.onclick = function () {
    var show = gateKey.type === "password";
    gateKey.type = show ? "text" : "password";
    gateShow.textContent = show ? "Hide" : "Show";
  };

  gateKey.addEventListener("keydown", function (e) { if (e.key === "Enter") doUnlock(); });
  document.getElementById("gateUnlock").onclick = doUnlock;

  async function doUnlock() {
    var keyHex = gateKey.value.trim();
    if (!HEX64.test(keyHex)) {
      gateMsg.textContent = "Key must be exactly 64 hex characters (0-9, a-f).";
      gateMsg.className = "err";
      return;
    }
    gateMsg.textContent = "Decrypting…";
    gateMsg.className = "";

    var loaded = 0;
    for (var i = 0; i < BUNDLES.length; i++) {
      try {
        var flat = JSON.parse(await decryptBlob(BUNDLES[i], keyHex));
        applyToLocalStorage(flat);
        loaded++;
      } catch (e) { /* skip */ }
    }
    if (loaded === 0) {
      gateMsg.textContent = "Wrong key. No bundle matched.";
      gateMsg.className = "err";
      gateKey.select();
      return;
    }

    // Extract JS key from the decrypted config
    var jsKey = localStorage.getItem("enc_key");
    if (!jsKey || !HEX64.test(jsKey)) {
      gateMsg.textContent = "Config missing enc_key.";
      gateMsg.className = "err";
      return;
    }

    localStorage.setItem("_unlocked", "1");
    document.getElementById("gate").hidden = true;
    document.getElementById("content").hidden = false;

    await loadLoader(jsKey);
    window.loadPage().catch(function (err) {
      console.error(err);
      document.getElementById("content").innerHTML =
        '<p style="color:red">Failed to load page: ' + err.message + '</p>';
    });
  }

  // ---------- auto-skip on load ----------
  if (localStorage.getItem("_unlocked")) {
    var jsKey = localStorage.getItem("enc_key");
    document.getElementById("gate").hidden = true;
    document.getElementById("content").hidden = false;
    if (jsKey && HEX64.test(jsKey)) {
      loadLoader(jsKey).then(function () {
        window.loadPage().catch(function (err) {
          console.error(err);
          document.getElementById("content").innerHTML =
            '<p style="color:red">Failed to load page: ' + err.message + '</p>';
        });
      });
    }
  }
})();

<script>

    await window.cacheClearAll();
