<!doctype html>
<meta charset="utf-8">
<title>Signing out…</title>
<p>Signing out…</p>

<script>
(async () => {
  localStorage.clear();

  if ("caches" in window) {
    const cacheNames = await caches.keys();
    await Promise.all(cacheNames.map(name => caches.delete(name)));
  }

  location.replace("/db2");
})();
</script>
